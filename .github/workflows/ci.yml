name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint, Type-Check, Migration & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: flowforge_test
        options: >-
          --health-cmd="pg_isready -U flowforge" --health-interval=5s --health-retries=10
        ports:
          - "5432:5432"
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-retries=10
        ports:
          - "6379:6379"

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://flowforge:ci@localhost:5432/flowforge_test
      REDIS_URL: redis://localhost:6379/15
      CELERY_BROKER_URL: redis://localhost:6379/14
      CELERY_RESULT_BACKEND: redis://localhost:6379/13
      JWT_SECRET_KEY: ci-only-secret-ci-only-secret-ci-only-secret
      # Generated dynamically in the setup step below to avoid missing secret errors

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Generate CI Fernet key
        id: fernet
        run: |
          FERNET_KEY=$(uv run python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          echo "ENCRYPTION_KEY=${FERNET_KEY}" >> $GITHUB_ENV

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Lint and format check (ruff)
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy)
        working-directory: backend
        run: uv run mypy app

      - name: Run Alembic migrations and drift check
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Run tests with coverage
        working-directory: backend
        run: uv run pytest --cov=app --cov-fail-under=80 --cov-report=xml

      - name: Security scanning (bandit)
        working-directory: backend
        run: uv run bandit -q -r app

  docker:
    name: Docker Build & Vulnerability Scan
    needs: [backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -f docker/backend.Dockerfile -t flowforge-backend:ci .

      - name: Vulnerability scan backend image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: flowforge-backend:ci
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "0"

      - name: Secret scan repository (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
