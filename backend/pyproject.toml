[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowforge"
version = "1.0.0"
description = "A Python-based workflow automation and background job processing platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    # Validation & config
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    # Database
    "sqlalchemy>=2.0.36,<3.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "alembic>=1.14.0,<2.0.0",
    # Cache & queue
    "redis>=5.2.0,<9.0.0",
    "celery[redis]>=5.4.0,<6.0.0",
    # Security & auth
    "argon2-cffi>=23.1.0,<24.0.0",
    "cryptography>=43.0.0,<44.0.0",
    "pyjwt>=2.9.0,<3.0.0",
    # Logging
    "structlog>=24.4.0,<25.0.0",
    # HTTP client (for http_request action)
    "httpx>=0.27.0,<1.0.0",
    # Schedule parsing
    "croniter>=3.0.0,<4.0.0",
    # Form data support
    "python-multipart>=0.0.18,<1.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "respx>=0.21.0,<1.0.0",
    "freezegun>=1.5.0,<2.0.0",
    "fakeredis>=2.26.0,<3.0.0",
    "factory-boy>=3.3.0,<4.0.0",
    # Linting & formatting
    "ruff>=0.8.0,<1.0.0",
    # Type checking
    "mypy>=1.13.0,<2.0.0",
    "types-redis>=4.6.0,<5.0.0",
    # Security auditing
    "bandit>=1.8.0,<2.0.0",
    "pip-audit>=2.7.0,<3.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- Ruff ---
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # bandit (security)
    "C90", # mccabe complexity
    "N",   # pep8-naming
    "ANN", # flake8-annotations (partial)
    "T20", # flake8-print
]
ignore = [
    "S101",   # Use of assert detected — allowed in tests
    "ANN401", # Dynamically typed expressions (Any) — needed in some places
    "B008",   # Do not perform function call in argument defaults (FastAPI Depends)
]
# McCabe complexity limit per SRS NFR-14
mccabe.max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "T20", "S105", "S106", "S107"]
"alembic/**" = ["ANN", "N999", "E501"]
"app/scripts/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --- mypy ---
[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = false
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "croniter.*",
    "argon2.*",
    "fakeredis.*",
    "factory.*",
    "freezegun.*",
    "respx.*",
]
ignore_missing_imports = true

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast unit tests (no external dependencies)",
    "integration: tests requiring PostgreSQL and Redis",
    "e2e: end-to-end tests against a running Compose stack",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic",
    "ignore::DeprecationWarning:sqlalchemy",
    "ignore::DeprecationWarning:starlette",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore::DeprecationWarning:httpx",
]

# --- Coverage ---
[tool.coverage.run]
source = ["app"]
omit = [
    "app/scripts/*",
    "alembic/*",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
