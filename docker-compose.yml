# FlowForge — Production-style Docker Compose Specification
# SRS §20.3: postgres:16, redis:7, migrate, api, mailpit, worker/scheduler (Phase 5)

version: "3.8"

networks:
  flowforge-net:
    name: flowforge-net
    driver: bridge

volumes:
  pgdata:
    name: flowforge-pgdata
  redisdata:
    name: flowforge-redisdata

services:
  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: flowforge-postgres
    restart: unless-stopped
    networks:
      - flowforge-net
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-flowforge}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowforge} -d ${POSTGRES_DB:-flowforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Redis 7 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: flowforge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - flowforge-net
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── Migrate & Seed (Runs Once) ─────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: flowforge-migrate
    restart: "no"
    networks:
      - flowforge-net
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m app.scripts.seed"]

  # ── FastAPI Application ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: flowforge-api
    restart: unless-stopped
    networks:
      - flowforge-net
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  # ── Mailpit (Local SMTP Server + UI) ───────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: flowforge-mailpit
    restart: unless-stopped
    networks:
      - flowforge-net
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8025/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
